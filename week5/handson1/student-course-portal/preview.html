<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hands-On 1: Student Course Portal</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #f4f7f6; color: #333; }
    .navbar { display: flex; justify-content: space-between; align-items: center; background: #2c3e50; padding: 15px 30px; color: white; }
    .brand { font-size: 1.4rem; font-weight: bold; }
    .nav-links { display: flex; list-style: none; gap: 20px; margin: 0; padding: 0; }
    .nav-links a { color: white; text-decoration: none; font-weight: 500; }
    .nav-links a:hover { text-decoration: underline; }
    .home-container { padding: 30px; max-width: 900px; margin: 0 auto; }
    .stats-row { display: flex; gap: 20px; margin-top: 25px; }
    .stat-card { flex: 1; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
    .stat-num { font-size: 2rem; font-weight: bold; color: #3498db; margin: 5px 0 0 0; }
  </style>
</head>
<body>
  <!-- Header Component -->
  <nav class="navbar">
    <div class="brand">Student Course Portal</div>
    <ul class="nav-links">
      <li><a href="#home">Home</a></li>
      <li><a href="#courses">Courses</a></li>
      <li><a href="#profile">Profile</a></li>
    </ul>
  </nav>

  <!-- Home Page Component -->
  <div class="home-container">
    <h1>Welcome to Student Course Portal</h1>
    <p>Manage your academic journey, browse available courses, track grades, and complete course enrollments.</p>
    
    <div class="stats-row">
      <div class="stat-card">
        <h3>Courses Available</h3>
        <p class="stat-num">12</p>
      </div>
      <div class="stat-card">
        <h3>Enrolled</h3>
        <p class="stat-num">3</p>
      </div>
      <div class="stat-card">
        <h3>GPA</h3>
        <p class="stat-num">3.8</p>
      </div>
    </div>
  </div>
</body>
</html>
