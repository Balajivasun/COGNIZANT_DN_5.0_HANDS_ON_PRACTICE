<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hands-On 5: Reactive Forms & Dynamic Controls</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; padding: 30px; background: #f4f7f6; }
    .form-container { max-width: 550px; margin: 0 auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
    input, select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; margin-top: 5px; }
    button { background: #2980b9; color: white; border: none; padding: 10px 18px; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>Reactive Student Enrollment Form (FormArray)</h2>
    <form onsubmit="alert('Reactive Form Submitted'); return false;">
      <div class="form-group"><label>Student Name *</label><input type="text" value="Alex Johnson"></div>
      <div class="form-group"><label>Student Email (Async check: test@ reserved)</label><input type="email" value="alex@example.com"></div>
      <div class="form-group"><label>Course Code (Sync check: no XX prefix)</label><input type="text" value="CS101"></div>
      <div class="form-group">
        <h3>Additional Courses (FormArray)</h3>
        <div id="courseArray"></div>
        <button type="button" style="background:#27ae60; width: fit-content; margin-top:5px;" onclick="addCourseField()">+ Add Course</button>
      </div>
      <button type="submit" style="margin-top:15px;">Submit Reactive Form</button>
    </form>
  </div>
  <script>
    function addCourseField() {
      var div = document.createElement('div');
      div.innerHTML = '<input type="text" placeholder="Course Code" style="margin-right:8px;"> <button type="button" style="background:#e74c3c; padding:4px 8px;" onclick="this.parentNode.remove()">Remove</button>';
      div.style.marginBottom = '8px';
      document.getElementById('courseArray').appendChild(div);
    }
  </script>
</body>
</html>
