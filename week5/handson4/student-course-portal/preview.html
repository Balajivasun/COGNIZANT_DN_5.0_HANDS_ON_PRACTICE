<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hands-On 4: Template-Driven Forms</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; padding: 30px; background: #f4f7f6; }
    .form-container { max-width: 500px; margin: 0 auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
    input, select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; margin-top: 5px; }
    button { background: #27ae60; color: white; border: none; padding: 10px 18px; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>Student Course Enrollment Request</h2>
    <form onsubmit="alert('Enrollment submitted successfully!'); return false;">
      <div class="form-group"><label>Student Name *</label><input type="text" required minlength="3"></div>
      <div class="form-group"><label>Student Email *</label><input type="email" required></div>
      <div class="form-group"><label>Course ID *</label><input type="number" required></div>
      <div class="form-group"><label>Preferred Semester</label><select><option>Odd</option><option>Even</option></select></div>
      <div class="form-group"><label><input type="checkbox" required> Agree to terms *</label></div>
      <button type="submit">Submit Request</button>
    </form>
  </div>
</body>
</html>
